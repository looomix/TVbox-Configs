name: Update Configs

on:
  schedule:
    # 每天 16:00 UTC（北京时间 00:00）检查一次；距上次成功更新不足 7 天时自动跳过
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制立即更新（忽略 7 天间隔）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-configs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and build
        run: |
          go vet ./...
          go build -o bin/tvboxgen ./cmd/tvboxgen

      - name: Generate configs
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: ./bin/tvboxgen -force=$FORCE -workers=16 -timeout=10s -history=8

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api sources
          if git diff --staged --quiet; then
            echo "no changes, nothing to commit"
            exit 0
          fi
          git commit -m "chore: 刷新视频源配置 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Purge jsDelivr cache
        if: always()
        run: |
          for f in api/tvbox.json api/moontv.json api/sources.txt api/status.json api/mirror.json api/index.json; do
            curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || true
          done
